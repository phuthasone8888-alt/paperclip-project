<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ເກມເຕັດຕຣິດ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== TOP BAR ===== */
    #topbar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px 4px;
      gap: 6px;
    }

    .stat-box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 5px 10px;
      text-align: center;
      flex: 1;
    }

    .stat-box .lbl {
      font-size: 9px;
      color: #8080b0;
      letter-spacing: 0.5px;
    }

    .stat-box .val {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      line-height: 1.2;
    }

    .stat-box .sub {
      font-size: 9px;
      color: #6060a0;
    }

    .title-box {
      font-size: 11px;
      color: #e0c060;
      font-weight: bold;
      text-align: center;
      flex: 0 0 auto;
      padding: 0 4px;
    }

    /* ===== GAME AREA ===== */
    #game-area {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 0 8px;
    }

    #gameCanvas {
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(80,80,255,0.25);
      display: block;
    }

    /* side panel */
    #side-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 2px;
    }

    .side-box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .side-box .lbl {
      font-size: 9px;
      color: #8080b0;
      margin-bottom: 4px;
    }

    #nextCanvas {
      display: block;
      margin: 0 auto;
    }

    .level-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      height: 5px;
      margin-top: 4px;
      overflow: hidden;
    }
    #levelBar {
      height: 100%;
      background: linear-gradient(90deg,#4060ff,#e0c060);
      border-radius: 4px;
      transition: width 0.3s;
      width: 0%;
    }

    /* ===== OVERLAY ===== */
    #canvas-wrap {
      position: relative;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,20,0.88);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }

    #overlay h1 {
      font-size: 24px;
      color: #e0c060;
      text-align: center;
      line-height: 1.4;
      text-shadow: 0 0 20px rgba(224,192,96,0.7);
    }

    #overlay p { font-size: 13px; color: #a0a0c0; text-align: center; }

    .btn-start {
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg,#4060ff,#8040ff);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(80,64,255,0.5);
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== TOUCH CONTROLS ===== */
    #controls {
      width: 100%;
      max-width: 420px;
      padding: 8px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .ctrl-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .cbtn {
      width: 68px;
      height: 68px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      color: #fff;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s, transform 0.08s;
      touch-action: manipulation;
    }

    .cbtn:active, .cbtn.pressed {
      background: rgba(255,255,255,0.22);
      transform: scale(0.92);
    }

    .cbtn.wide {
      width: 148px;
      font-size: 20px;
      gap: 6px;
    }

    .cbtn.drop {
      background: rgba(224,192,96,0.15);
      border-color: rgba(224,192,96,0.4);
      color: #e0c060;
    }

    .cbtn.pause {
      background: rgba(100,100,200,0.15);
      border-color: rgba(100,100,200,0.4);
      color: #a0a0ff;
      width: 68px;
      font-size: 20px;
    }

    .ctrl-hint {
      font-size: 10px;
      color: #5050a0;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Top Stats -->
<div id="topbar">
  <div class="stat-box">
    <div class="lbl">ຄະແນນ</div>
    <div class="val" id="scoreDisplay">0</div>
    <div class="sub">ສູງສຸດ: <span id="highScoreDisplay">0</span></div>
  </div>
  <div class="title-box">🎮<br/>ເຕັດຕຣິດ</div>
  <div class="stat-box">
    <div class="lbl">ລະດັບ</div>
    <div class="val" id="levelDisplay">1</div>
    <div class="sub">ແຖວ: <span id="linesDisplay">0</span></div>
  </div>
</div>

<!-- Game + Side Panel -->
<div id="game-area">
  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h1>🎮<br/>ເກມເຕັດຕຣິດ<br/><span style="font-size:14px;color:#a0a0c0;">ຕໍ່ຊິ້ນສ່ວນ</span></h1>
      <button class="btn-start" id="startBtn" onclick="startGame()">ເລີ່ມຫຼິ້ນ</button>
    </div>
  </div>

  <div id="side-panel">
    <div class="side-box">
      <div class="lbl">ຕໍ່ໄປ</div>
      <canvas id="nextCanvas"></canvas>
    </div>
    <div class="side-box" style="min-width:72px;">
      <div class="lbl">ລະດັບ</div>
      <div style="font-size:20px;font-weight:bold;" id="levelDisplay2">1</div>
      <div class="level-bar-wrap"><div id="levelBar"></div></div>
    </div>
  </div>
</div>

<!-- Touch Controls -->
<div id="controls">
  <!-- Row 1: rotate -->
  <div class="ctrl-row">
    <div class="cbtn" id="btnRotate" ontouchstart="handleBtn('rotate',$event)" onpointerdown="handleBtn('rotate',event)">↻</div>
  </div>
  <!-- Row 2: left, soft drop, right -->
  <div class="ctrl-row">
    <div class="cbtn" id="btnLeft"  ontouchstart="startRepeat('left',event)"   ontouchend="stopRepeat(event)"   onpointerdown="startRepeat('left',event)"   onpointerup="stopRepeat(event)"   onpointercancel="stopRepeat(event)">◀</div>
    <div class="cbtn" id="btnDown"  ontouchstart="startRepeat('down',event)"   ontouchend="stopRepeat(event)"   onpointerdown="startRepeat('down',event)"   onpointerup="stopRepeat(event)"   onpointercancel="stopRepeat(event)">▼</div>
    <div class="cbtn" id="btnRight" ontouchstart="startRepeat('right',event)"  ontouchend="stopRepeat(event)"   onpointerdown="startRepeat('right',event)"  onpointerup="stopRepeat(event)"   onpointercancel="stopRepeat(event)">▶</div>
  </div>
  <!-- Row 3: hard drop + pause -->
  <div class="ctrl-row">
    <div class="cbtn wide drop" id="btnDrop"  ontouchstart="handleBtn('drop',event)"  onpointerdown="handleBtn('drop',event)">⬇ ລົງທັນທີ</div>
    <div class="cbtn pause"     id="btnPause" ontouchstart="handleBtn('pause',event)" onpointerdown="handleBtn('pause',event)">⏸</div>
  </div>
  <div class="ctrl-hint">◀▶ ຍ້າຍ &nbsp;|&nbsp; ↻ ໝູນ &nbsp;|&nbsp; ▼ ລົງໄວ &nbsp;|&nbsp; ⬇ ລົງທັນທີ</div>
</div>

<script>
// ============================================================
// Responsive sizing — fit to screen
// ============================================================
(function resize() {
  const COLS = 10, ROWS = 20;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // Reserve space: topbar ~62, controls ~230, padding
  const reserved = 62 + 230 + 20;
  const sideW = 84;
  const gap = 8;
  const maxCanvasH = vh - reserved;
  const maxCanvasW = vw - sideW - gap - 24;

  let block = Math.floor(Math.min(maxCanvasW / COLS, maxCanvasH / ROWS));
  block = Math.max(18, Math.min(block, 30));

  const cw = block * COLS;
  const ch = block * ROWS;
  const nb = Math.floor(sideW / 5);

  const gameCanvas = document.getElementById('gameCanvas');
  const nextCanvas = document.getElementById('nextCanvas');
  gameCanvas.width  = cw;
  gameCanvas.height = ch;
  nextCanvas.width  = nb * 5;
  nextCanvas.height = nb * 5;

  window._BLOCK = block;
  window._NB    = nb;
  window._COLS  = COLS;
  window._ROWS  = ROWS;
})();

// ============================================================
// Pieces
// ============================================================
const PIECES = {
  I:{ shape:[[1,1,1,1]],          color:'#00d4ff' },
  O:{ shape:[[1,1],[1,1]],         color:'#ffd700' },
  T:{ shape:[[0,1,0],[1,1,1]],     color:'#cc44ff' },
  S:{ shape:[[0,1,1],[1,1,0]],     color:'#44ff88' },
  Z:{ shape:[[1,1,0],[0,1,1]],     color:'#ff4444' },
  J:{ shape:[[1,0,0],[1,1,1]],     color:'#4488ff' },
  L:{ shape:[[0,0,1],[1,1,1]],     color:'#ff8844' },
};
const PKEYS = Object.keys(PIECES);

const canvas   = document.getElementById('gameCanvas');
const ctx      = canvas.getContext('2d');
const nextCvs  = document.getElementById('nextCanvas');
const nextCtx  = nextCvs.getContext('2d');

const COLS = window._COLS;
const ROWS = window._ROWS;

let board, cur, nxt;
let score=0, hiScore=+(localStorage.getItem('tl_hi')||0);
let level=1, lines=0, linesLvl=0;
let running=false, paused=false;
let animId=null, lastT=0, dropAcc=0, dropSpd=800;

// ============================================================
// Board helpers
// ============================================================
const mkBoard = ()=> Array.from({length:ROWS},()=>Array(COLS).fill(0));

function randPiece(){
  const k = PKEYS[Math.floor(Math.random()*PKEYS.length)];
  const p = PIECES[k];
  const s = p.shape.map(r=>[...r]);
  return { shape:s, color:p.color, x:Math.floor((COLS-s[0].length)/2), y:0 };
}

function rotate(sh){
  const r=sh.length, c=sh[0].length;
  const out=Array.from({length:c},()=>Array(r).fill(0));
  for(let i=0;i<r;i++) for(let j=0;j<c;j++) out[j][r-1-i]=sh[i][j];
  return out;
}

function valid(sh,x,y){
  for(let r=0;r<sh.length;r++){
    for(let c=0;c<sh[r].length;c++){
      if(!sh[r][c]) continue;
      const nx=x+c, ny=y+r;
      if(nx<0||nx>=COLS||ny>=ROWS) return false;
      if(ny>=0&&board[ny][nx]) return false;
    }
  }
  return true;
}

function place(){
  cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v&&cur.y+r>=0) board[cur.y+r][cur.x+c]=cur.color;
  }));
}

function clearLines(){
  let n=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(c=>c)){
      board.splice(r,1); board.unshift(Array(COLS).fill(0));
      n++; r++;
    }
  }
  if(n){
    const pts=[0,100,300,500,800];
    score+=(pts[n]||800)*level;
    lines+=n; linesLvl+=n;
    if(linesLvl>=10){ level++; linesLvl-=10; dropSpd=Math.max(80,800-(level-1)*70); }
    if(score>hiScore){ hiScore=score; localStorage.setItem('tl_hi',hiScore); }
    updateUI();
  }
}

function ghostY(){
  let gy=cur.y;
  while(valid(cur.shape,cur.x,gy+1)) gy++;
  return gy;
}

// ============================================================
// Draw
// ============================================================
function drawBlock(c,x,y,col,sz,a=1){
  const px=x*sz+1, py=y*sz+1, s=sz-2;
  c.save(); c.globalAlpha=a;
  c.fillStyle=col; c.fillRect(px,py,s,s);
  c.fillStyle='rgba(255,255,255,0.25)'; c.fillRect(px,py,s,4); c.fillRect(px,py,4,s);
  c.fillStyle='rgba(0,0,0,0.2)'; c.fillRect(px,py+s-4,s,4); c.fillRect(px+s-4,py,4,s);
  c.restore();
}

function draw(){
  const B=window._BLOCK, NB=window._NB;

  // board bg
  ctx.fillStyle='#080820';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.strokeRect(c*B,r*B,B,B);
  }
  // placed
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(board[r][c]) drawBlock(ctx,c,r,board[r][c],B);

  if(cur){
    // ghost
    const gy=ghostY();
    if(gy!==cur.y)
      cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
        if(v) drawBlock(ctx,cur.x+c,gy+r,cur.color,B,0.18);
      }));
    // piece
    cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
      if(v) drawBlock(ctx,cur.x+c,cur.y+r,cur.color,B);
    }));
  }

  // next
  nextCtx.fillStyle='#080820';
  nextCtx.fillRect(0,0,nextCvs.width,nextCvs.height);
  if(nxt){
    const ox=Math.floor((5-nxt.shape[0].length)/2);
    const oy=Math.floor((5-nxt.shape.length)/2);
    nxt.shape.forEach((row,r)=>row.forEach((v,c)=>{
      if(v) drawBlock(nextCtx,ox+c,oy+r,nxt.color,NB);
    }));
  }
}

// ============================================================
// Game loop
// ============================================================
function loop(ts){
  if(!running||paused) return;
  const dt=ts-lastT; lastT=ts;
  dropAcc+=dt;
  if(dropAcc>=dropSpd){ dropAcc=0; doDown(); }
  draw();
  animId=requestAnimationFrame(loop);
}

// ============================================================
// Moves
// ============================================================
function doLeft(){  if(running&&!paused&&valid(cur.shape,cur.x-1,cur.y)) cur.x--; }
function doRight(){ if(running&&!paused&&valid(cur.shape,cur.x+1,cur.y)) cur.x++; }
function doDown(){
  if(!running||paused) return;
  if(valid(cur.shape,cur.x,cur.y+1)) cur.y++;
  else{ place(); clearLines(); spawn(); }
}
function doRotate(){
  if(!running||paused) return;
  const rot=rotate(cur.shape);
  for(const k of [0,-1,1,-2,2]){
    if(valid(rot,cur.x+k,cur.y)){ cur.shape=rot; cur.x+=k; return; }
  }
}
function doDrop(){
  if(!running||paused) return;
  while(valid(cur.shape,cur.x,cur.y+1)) cur.y++;
  score+=2; place(); clearLines(); spawn(); updateUI();
}
function doPause(){
  if(!running) return;
  paused=!paused;
  if(!paused){ lastT=performance.now(); animId=requestAnimationFrame(loop); }
  else{
    cancelAnimationFrame(animId);
    ctx.save();
    ctx.fillStyle='rgba(0,0,20,0.75)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff'; ctx.font=`bold ${window._BLOCK*1}px sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('⏸ ຢຸດຊົ່ວຄາວ',canvas.width/2,canvas.height/2-16);
    ctx.font=`${window._BLOCK*0.6}px sans-serif`;
    ctx.fillStyle='#a0a0c0';
    ctx.fillText('ກົດ ⏸ ເພື່ອຫຼິ້ນຕໍ່',canvas.width/2,canvas.height/2+20);
    ctx.restore();
  }
}

function spawn(){
  cur=nxt||randPiece(); nxt=randPiece();
  if(!valid(cur.shape,cur.x,cur.y)) endGame();
}

// ============================================================
// Start / End
// ============================================================
function startGame(){
  board=mkBoard(); score=0; level=1; lines=0; linesLvl=0;
  dropSpd=800; dropAcc=0; running=true; paused=false;
  document.getElementById('overlay').style.display='none';
  updateUI(); nxt=randPiece(); spawn();
  lastT=performance.now();
  cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}

function endGame(){
  running=false; cancelAnimationFrame(animId); draw();
  const ov=document.getElementById('overlay');
  const isHi=score>=hiScore&&score>0;
  ov.innerHTML=`
    <h1 style="font-size:22px;">ເກມຈົບແລ້ວ! 😢</h1>
    <p style="font-size:15px;color:#e0c060;">ຄະແນນ: <strong>${score.toLocaleString()}</strong></p>
    <p style="font-size:12px;color:#8080a0;">ລະດັບ ${level} &nbsp;|&nbsp; ${lines} ແຖວ</p>
    ${isHi?'<p style="color:#ffd700;font-size:13px;">🏆 ຄະແນນສູງສຸດໃໝ່!</p>':''}
    <button class="btn-start" onclick="startGame()">ຫຼິ້ນໃໝ່</button>`;
  ov.style.display='flex';
}

function updateUI(){
  document.getElementById('scoreDisplay').textContent   = score.toLocaleString();
  document.getElementById('highScoreDisplay').textContent = hiScore.toLocaleString();
  document.getElementById('levelDisplay').textContent   = level;
  document.getElementById('levelDisplay2').textContent  = level;
  document.getElementById('linesDisplay').textContent   = lines;
  document.getElementById('levelBar').style.width       = Math.min(linesLvl/10*100,100)+'%';
}

// ============================================================
// Touch button handling (prevent double-fire on pointer+touch)
// ============================================================
const pressed = new Set();

function handleBtn(action, e){
  e.preventDefault();
  const id=e.pointerId??e.changedTouches?.[0]?.identifier??0;
  if(pressed.has('btn_'+action+'_'+id)) return;
  pressed.add('btn_'+action+'_'+id);
  setTimeout(()=>pressed.delete('btn_'+action+'_'+id),300);
  if(action==='rotate') doRotate();
  if(action==='drop')   doDrop();
  if(action==='pause')  doPause();
}

// Repeat for left/right/down
let repeatAction=null, repeatDas=null, repeatArr=null;

function startRepeat(action, e){
  e.preventDefault();
  stopRepeat(e);
  if(action==='left')  doLeft();
  if(action==='right') doRight();
  if(action==='down')  doDown();
  repeatAction=action;
  repeatDas=setTimeout(()=>{
    repeatArr=setInterval(()=>{
      if(action==='left')  doLeft();
      if(action==='right') doRight();
      if(action==='down')  doDown();
    },50);
  },170);
}

function stopRepeat(e){
  e.preventDefault();
  clearTimeout(repeatDas); clearInterval(repeatArr);
  repeatAction=null;
}

// ============================================================
// Keyboard (for when on desktop too)
// ============================================================
const ks={};
document.addEventListener('keydown',e=>{
  if(ks[e.code]) return; ks[e.code]=true;
  if(e.code==='ArrowLeft')  { e.preventDefault(); doLeft(); }
  if(e.code==='ArrowRight') { e.preventDefault(); doRight(); }
  if(e.code==='ArrowDown')  { e.preventDefault(); dropAcc=0; doDown(); }
  if(e.code==='ArrowUp')    { e.preventDefault(); doRotate(); }
  if(e.code==='Space')      { e.preventDefault(); doDrop(); }
  if(e.code==='KeyP')       doPause();
});
document.addEventListener('keyup',e=>{ ks[e.code]=false; });

// ============================================================
// Init draw
// ============================================================
updateUI();
board=mkBoard();
draw();
</script>
</body>
</html>
